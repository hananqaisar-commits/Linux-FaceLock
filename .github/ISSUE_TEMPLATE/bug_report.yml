name: 🐛 Bug Report
description: Create a report to help us improve Linux-FaceLock
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the sections below.
  - type: input
    id: environment
    attributes:
      label: Linux Distribution & Version
      placeholder: e.g. Ubuntu 24.04 LTS / Arch Linux / Fedora 40
    validations:
      required: true
  - type: input
    id: desktop_env
    attributes:
      label: Desktop Environment / Display Manager
      placeholder: e.g. GNOME 46 (Wayland) / KDE Plasma 6 (X11) / GDM / LightDM
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Logs
      placeholder: Paste console output or log file snippet (`journalctl -u nova-facelock.service`)
    validations:
      required: true
