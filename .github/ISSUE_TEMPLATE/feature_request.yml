name: 💡 Feature Request
description: Suggest an idea or feature enhancement for Linux-FaceLock
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make Linux-FaceLock better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: Describe the problem or friction point you are experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: Clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      placeholder: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add any screenshots, mockups, or conceptual diagrams here.
