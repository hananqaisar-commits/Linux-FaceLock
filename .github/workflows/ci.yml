name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 opencv-python-headless numpy pyyaml python-xlib

      - name: Syntax check (compile all .py)
        run: python -m compileall -q nova_unlock/ scripts/

      - name: Verify postinstall script
        run: bash -n scripts/nova_pkg_postinstall.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 opencv-python-headless numpy pyyaml python-xlib pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || true
